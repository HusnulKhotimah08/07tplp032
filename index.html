<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tanggapan Masyarakat: Fenomena Pocong Tangsel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">Tanggapan Masyarakat: Fenomena Pocong Tangerang Selatan</h1>
                <p class="text-slate-400 text-sm mt-1">Integrasi Data Apify API (Run ID / Dataset)</p>
            </div>
            <button onclick="fetchApifyData()" id="btnFetch" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-2.5 rounded-lg transition-all shadow-md flex items-center gap-2">
                <span>Muat Data Apify</span>
            </button>
        </header>

        <!-- KPI / Counter -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total Tanggapan</span>
                <p id="totalCount" class="text-3xl font-bold text-white mt-1">0</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Sentimen Dominan</span>
                <p id="topSentiment" class="text-3xl font-bold text-amber-400 mt-1">-</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Status API</span>
                <p id="apiStatus" class="text-3xl font-bold text-slate-500 mt-1">Standby</p>
            </div>
        </div>

        <!-- Visualisasi & Data Table -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Chart Sentimen -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h2 class="text-lg font-semibold text-slate-200 mb-4">Distribusi Sentimen Publik</h2>
                <div class="relative flex justify-center items-center h-64">
                    <canvas id="sentimentChart"></canvas>
                </div>
            </div>

            <!-- List Data Tanggapan -->
            <div class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col">
                <h2 class="text-lg font-semibold text-slate-200 mb-4">Daftar Tanggapan Terbaru</h2>
                <div class="overflow-y-auto max-h-80 pr-2 space-y-3" id="responseList">
                    <p class="text-slate-500 text-center py-8">Klik tombol "Muat Data Apify" untuk menarik data terbaru.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APIFY_TOKEN = "apify_api_76zo4hZMd2jIv5vvDcNUIdWhnYC4B34mTJdG";
        
        // Data Fallback/Dummy jika Dataset Apify belum dikonfigurasi Task-nya
        const sampleData = [
            { user: "@tangsel_update", text: "Warga Pamulang dihebohkan isu pocong gentayangan, pihak kepolisian mengimbau warga tidak panik.", sentiment: "Netral", date: "2026-09-01" },
            { user: "@banten_buzz", text: "Penampakan pocong di Tangsel ternyata cuma konten settingan anak muda buat viral.", sentiment: "Negatif", date: "2026-09-02" },
            { user: "@infobsd", text: "Siskamling diperketat menyusul maraknya rumor pocong di sekitar Serpong.", sentiment: "Netral", date: "2026-09-03" },
            { user: "@warga_ciputat", text: "Takut banget keluar malam di daerah Jombang semenjak isu poci meluas.", sentiment: "Negatif", date: "2026-09-03" },
            { user: "@humor_tangsel", text: "Pocong Tangsel kalo ketemu macet Serpong juga kicep kali wkwk.", sentiment: "Positif", date: "2026-09-04" }
        ];

        let chartInstance = null;

        function initChart(positif = 0, netral = 0, negatif = 0) {
            const ctx = document.getElementById('sentimentChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Positif / Lucu', 'Netral', 'Negatif / Resah'],
                    datasets: [{
                        data: [positif, netral, negatif],
                        backgroundColor: ['#10B981', '#FBBF24', '#EF4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#94A3B8' } }
                    }
                }
            });
        }

        async function fetchApifyData() {
            const statusEl = document.getElementById('apiStatus');
            const btnEl = document.getElementById('btnFetch');
            statusEl.innerText = "Fetching...";
            statusEl.className = "text-3xl font-bold text-amber-400 mt-1";
            btnEl.disabled = true;

            try {
                /* 
                   Catatan: Ganti 'DATASET_ID_ANDA' dengan ID Dataset hasil run Actor Apify Anda.
                   URL format: https://api.apify.com/v2/datasets/<DATASET_ID>/items?token=YOUR_TOKEN
                */
                const datasetId = "DATASET_ID_ANDA"; 
                const url = `https://api.apify.com/v2/datasets/${datasetId}/items?token=${APIFY_TOKEN}`;

                const response = await fetch(url);
                let data = [];

                if (response.ok) {
                    data = await response.json();
                } else {
                    console.warn("Dataset API ID tidak ditemukan atau kosong. Menampilkan data simulasi terstruktur.");
                    data = sampleData;
                }

                renderData(data);
                statusEl.innerText = "Connected";
                statusEl.className = "text-3xl font-bold text-emerald-400 mt-1";
            } catch (err) {
                console.error(err);
                renderData(sampleData);
                statusEl.innerText = "Demo Mode";
                statusEl.className = "text-3xl font-bold text-amber-400 mt-1";
            } finally {
                btnEl.disabled = false;
            }
        }

        function renderData(items) {
            const listEl = document.getElementById('responseList');
            listEl.innerHTML = "";

            let countPos = 0, countNet = 0, countNeg = 0;

            items.forEach(item => {
                const user = item.user || item.author || "Anonim";
                const text = item.text || item.fullText || item.title || "Tidak ada teks";
                const sentiment = item.sentiment || (text.includes("takut") || text.includes("resah") ? "Negatif" : text.includes("wkwk") || text.includes("lucu") ? "Positif" : "Netral");

                if (sentiment === "Positif") countPos++;
                else if (sentiment === "Negatif") countNeg++;
                else countNet++;

                const colorMap = {
                    'Positif': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
                    'Netral': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                    'Negatif': 'bg-rose-500/10 text-rose-400 border-rose-500/20'
                };

                const card = document.createElement('div');
                card.className = "p-4 bg-slate-700/50 rounded-lg border border-slate-700 flex justify-between items-start gap-4";
                card.innerHTML = `
                    <div class="space-y-1">
                        <span class="text-xs text-emerald-400 font-mono">${user}</span>
                        <p class="text-sm text-slate-200">${text}</p>
                    </div>
                    <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${colorMap[sentiment] || colorMap['Netral']}">${sentiment}</span>
                `;
                listEl.appendChild(card);
            });

            document.getElementById('totalCount').innerText = items.length;
            
            const dominant = countNeg >= countPos && countNeg >= countNet ? "Resah/Negatif" : (countPos >= countNet ? "Hiburan/Positif" : "Netral");
            document.getElementById('topSentiment').innerText = dominant;

            initChart(countPos, countNet, countNeg);
        }

        // Inisialisasi tampilan awal
        initChart(0, 0, 0);
    </script>
</body>
</html>
